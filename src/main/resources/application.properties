spring.application.name=polizas
server.port=8080

# Base de datos en memoria (H2): se crea al iniciar y se carga con data.sql
spring.datasource.url=jdbc:h2:mem:polizasdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=true

# Seguridad minima: header obligatorio x-api-key
app.seguridad.api-key=123456

# Mock del CORE: endpoint al que se envian los eventos de cada operacion
app.core.url=http://localhost:${server.port}/core-mock/evento

# IPC (%) que se aplica en la renovacion
app.renovacion.ipc-porcentaje=5.20
